<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KPI Fitness Memberships</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>KPI Fitness memberships</h1>
    <p>Measure every detail. Improve together.</p>

    <label>Billing
      <select id="interval">
        <option value="monthly">Monthly</option>
        <option value="annual">Annual</option>
      </select>
    </label>

    <!-- Demo only: identity should come from your login session. -->
    <fieldset>
      <legend>Your details (demo)</legend>
      <input id="userId" placeholder="Member ID" value="demo_member_1">
      <input id="email" type="email" placeholder="Email" value="member@example.com">
    </fieldset>

    <section class="plans">
      <article><h2>Essential</h2><button data-plan="essential">Join</button></article>
      <article><h2>Performance</h2><button data-plan="performance">Join</button></article>
      <article><h2>Elite</h2><button data-plan="elite">Join</button></article>
    </section>

    <button id="portal" class="secondary">Manage my membership</button>
    <p id="error" role="alert"></p>
  </main>
  <script src="/app.js"></script>
</body>
</html>
